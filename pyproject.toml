[project]
name = "ccbp-pytorch"
version = "0.0.3"
description = "Implementation of Continuous Continual BackPropagation (CCBP) in Pytorch"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'continual learning',
    'plasticity',
    'backpropagation'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einops>=0.8.1",
    "torch>=2.5",
    "torch-einops-utils>=0.1.24"
]

[project.urls]
Homepage = "https://pypi.org/project/ccbp-pytorch/"
Repository = "https://github.com/lucidrains/ccbp-pytorch"

[project.optional-dependencies]
test = [
    "pytest",
    "lion-pytorch",
    "adam-atan2-pytorch",
    "x-mlps-pytorch"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fire",
    "numpy",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "lion-pytorch>=0.2.3",
    "adam-atan2-pytorch>=0.3.6",
    "x-mlps-pytorch",
    "pytest",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/ccbp_pytorch",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE"
]
exclude = [
    "/.gitignore"
]

[tool.hatch.build.targets.wheel]
packages = ["ccbp_pytorch"]
